[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apollo-timing"
version = "0.8.3"
description = "APOLLO isolated and Bayesian binary pulsar timing solver"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Yirong Huang"}
]
keywords = ["pulsar", "timing", "astronomy", "gravitational-waves", "bayesian"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "dynesty>=3.1,<4",
    "emcee>=3.1.6",
    "h5py>=3.10",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "pint-pulsar>=1.1.4",
    "scipy>=1.11",
]

[project.optional-dependencies]
multinest = ["pymultinest>=2.12"]
test = ["pytest>=8", "pytest-cov>=5"]
dev = [
    "build>=1.2",
    "mypy>=1.9",
    "pytest>=8",
    "pytest-cov>=5",
    "PyYAML>=6",
    "ruff>=0.4",
    "twine>=5",
]

[project.scripts]
apollo-timing = "apollo_timing.pipeline.apollo_timing:main"
apollo-bootstrap-binary = "apollo_timing.inference.bayesian_coarse_binary_bootstrap:main"
apollo-bootstrap-ell1 = "apollo_timing.inference.bayesian_partial_ell1_bootstrap:main"
apollo-foldbank = "apollo_timing.pipeline.apollo_foldbank:main"
apollo-observe = "apollo_timing.inference.bayesian_observation_planner:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
apollo_timing = ["release_profile.json", "data/resource_manifest.json",
    "data/ephemerides/*.bsp", "data/clocks/*.clk", "data/clocks/*.dat"]
